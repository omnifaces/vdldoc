<!DOCTYPE html>
<html>

  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="description" content="Vdldoc : Facelets .taglib.xml documentation generator">

    <link rel="stylesheet" type="text/css" media="screen" href="stylesheets/stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">

    <title>Vdldoc</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TG0X7NQJZ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TG0X7NQJZ0');
    </script>
  </head>

  <body>

    <!-- HEADER -->
    <div id="header_wrap" class="outer">
        <header class="inner">
          <a id="forkme_banner" href="https://github.com/omnifaces/vdldoc">View on GitHub</a>
          <h1 id="project_title">Vdldoc</h1>
          <h2 id="project_tagline">Facelets .taglib.xml documentation generator</h2>
        </header>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main_content_wrap" class="outer">
      <section id="main_content" class="inner markdown-body">
        <p id="status">Loading README...</p>
      </section>
    </div>

    <!-- FOOTER  -->
    <div id="footer_wrap" class="outer">
      <footer class="inner">
        <p class="copyright">Vdldoc maintained by <a href="https://github.com/omnifaces">omnifaces</a></p>
        <p>Published with <a href="https://pages.github.com">GitHub Pages</a></p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script>
      marked.setOptions({
        highlight: function(code, language) {
          if (language && hljs.getLanguage(language)) {
            return hljs.highlight(code, { language: language }).value;
          }
          else {
            return hljs.highlightAuto(code).value;
          }
        }
      });

      const readmeUrl = 'https://raw.githubusercontent.com/omnifaces/vdldoc/main/README.md';

      fetch(readmeUrl).then(response => {
        if (!response.ok) {
          throw new Error('response status was not ok');
        }
        return response.text();
      }).then(text => {
        document.getElementById('main_content').innerHTML = marked.parse(text.substring(text.indexOf("##")));
        document.querySelectorAll('#main_content pre code').forEach(block => hljs.highlightElement(block));
      }).catch(error => {
        document.getElementById('status').innerHTML = `<span style="color:#c00;">Error loading README: ${error.message}</span>`;
      });
    </script>
  </body>
</html>
